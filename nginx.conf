server {
  listen 80;
  listen [::]:80;
  server_name _;

  # 统一入口补齐尾部斜杠，确保相对资源和 publicPath 均以 /flame/ 为基准。
  location = /flame {
    return 301 /flame/;
  }

  # 构建产物带内容哈希，文件变化会生成新 URL，因此可安全交给 WebView 长期缓存。
  location ~* "^/flame/(img|js|css|fonts)/(.+\.[0-9a-f]{8}\.(?:css|js|png|jpe?g|webp|gif|svg|woff2?))$" {
    alias /usr/share/nginx/html/$1/$2;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # 外层 Nginx 保留 /flame/ 前缀转发到本容器，因此这里用 alias 去除 URL 前缀后读取 dist。
  location /flame/ {
    alias /usr/share/nginx/html/;
    index index.html;
    add_header Cache-Control "no-cache" always;
  }
}
